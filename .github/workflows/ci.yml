name: CI

on:
  push:
    branches:
      - main
      - "release/**"
      - "feat/**"
      - "fix/**"
      - "docs/**"
      - "refactor/**"
      - "chore/**"
      - "test/**"
      - "perf/**"
      - "build/**"
      - "ci/**"
      - "style/**"
      - "security/**"
  pull_request:
    branches:
      - main
      - "release/**"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      # Hash-checked wheels from the lock, then konfig itself with no dependency
      # resolution and the build backend taken from the lock.
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes --only-binary :all: -r requirements/dev.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Run tests
        run: pytest --cov=konfig --cov-report=xml -v

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-report
          path: coverage.xml

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes --only-binary :all: -r requirements/dev.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Check formatting (black)
        run: black --check src/ tests/

      - name: Check imports (isort)
        run: isort --check-only src/ tests/

      - name: Type checking (mypy)
        run: mypy src/konfig

  lock:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false

      # The same commands as the headers of the lock files. uv keeps the committed
      # pins as preferences, but would also carry their hashes over unchecked, so
      # the hashes are stripped first and recomputed from the index. Any
      # difference means a lock is stale or was edited by hand.
      - name: Regenerate the lock files
        run: |
          sed -i -e '/^ *--hash=/d' -e 's/ \\$//' requirements/build.txt requirements/dev.txt
          uv pip compile --universal --generate-hashes --python-version 3.10 requirements/build.in -o requirements/build.txt
          uv pip compile --universal --generate-hashes --python-version 3.10 pyproject.toml requirements/dev.in --extra dev --extra aws -o requirements/dev.txt

      - name: Fail if the lock files differ from what is committed
        run: git diff --exit-code -- requirements/
