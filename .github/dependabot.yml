# Weekly version updates for the SHA-pinned GitHub Actions in .github/workflows.
# Dependabot replaces each full-SHA pin and its trailing tag comment in place.
# The lock files under requirements/ are regenerated by hand with uv (see the
# README), so no pip ecosystem is configured here.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
